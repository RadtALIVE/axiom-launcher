  <text x="72" y="270" fill="#686777" font-family="Segoe UI,Arial,sans-serif" font-size="20" letter-spacing="5">LAUNCHER BY STAR®</text>
  <rect x="72" y="300" width="178" height="3" rx="2" fill="url(#accent)"/>
