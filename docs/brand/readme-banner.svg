<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Horizon Launcher</title>
  <desc id="desc">A minimal banner for Horizon Launcher by Star.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FAF9FD"/><stop offset="1" stop-color="#F0F3FB"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#7768F7"/><stop offset="1" stop-color="#4A9BE8"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <circle cx="1020" cy="50" r="220" fill="#7768F7" opacity=".055"/>
  <circle cx="1100" cy="315" r="150" fill="#4A9BE8" opacity=".07"/>
  <path d="M910 80c80 64 102 132 122 226M975 55c78 65 129 146 160 235" fill="none" stroke="#7768F7" stroke-width="2" opacity=".13"/>
  <rect x="70" y="73" width="90" height="90" rx="26" fill="#fff"/>
